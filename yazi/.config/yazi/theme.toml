count_selected = { fg = "#181818", bg = "#00eb07" }

border_symbol = "│"
border_style  = { fg = "#768699" } # Overlay1


[tabs]
active   = { fg = "#181818", bg = "#c4e0ff", bold = true } # Base -> Text
inactive = { fg = "#c4e0ff", bg = "#3b434d" } # Text -> Surface1

[mode]
normal_main = { fg = "#181818", bg = "#00eb07", bold = true }
normal_alt  = { fg = "#00eb07", bg = "#161616"} # Green -> Mantle

select_main = { fg = "#181818", bg = "#00beeb", bold = true } # Cyan selection
select_alt  = { fg = "#00beeb", bg = "#161616"}

unset_main  = { fg = "#181818", bg = "#eb0000", bold = true }
