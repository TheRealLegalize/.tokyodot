[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#c4e0ff", bold = true }
progress_normal = { fg = "#006ceb", bg = "#3b434d" } # Blue -> Surface1
progress_error  = { fg = "#eb0000", bg = "#3b434d" }

perm_type  = { fg = "#006ceb" }
perm_read  = { fg = "#eb8700" }
perm_write = { fg = "#eb0000" }
perm_exec  = { fg = "#00eb07" }
perm_sep   = { fg = "#768699" }

[input]
border   = { fg = "#eb8700" } # Accent для фокуса ввода
title    = {}
value    = {}
selected = { reversed = true }

[pick]
border   = { fg = "#eb8700" }
active   = { fg = "#9514ff" }
inactive = {}

[confirm]
border     = { fg = "#eb0000" }
