[mgr]
cwd = { fg = "#00beeb" } # Cyan (Teal)

hovered         = { fg = "#181818", bg = "#00eb07" } # Base -> Green
preview_hovered = { fg = "#181818", bg = "#c4e0ff" } # Base -> Text

find_keyword  = { fg = "#eb8700", italic = true } # Yellow/Accent
find_position = { fg = "#9514ff", bg = "reset", italic = true } # Pink/Purple

marker_copied   = { fg = "#00eb07", bg = "#00eb07" }
