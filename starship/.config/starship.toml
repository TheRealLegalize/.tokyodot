palette = "noctalia"
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
style = "bold green" # Зеленый для веток
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red" # Красный для изменений
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold blue)" # Синий акцент при успехе
error_symbol = "[❯](bold red)"   # Красный при ошибке
vicmd_symbol = "[❮](bold magenta)"   # Фиолетовый для Vim-мода

[palettes.noctalia]
blue      = "#7aa2f7"
red       = "#f7768e"
green     = "#9ece6a"
yellow    = "#e0af68"
cyan      = "#7dcfff"
magenta   = "#bb9af7"
white     = "#a9b1d6"
black     = "#15161e"

# Extended palette (Catppuccin-compatible names)
rosewater = "#e0af68"
flamingo  = "#f7768e"
pink      = "#bb9af7"
mauve     = "#bb9af7"
maroon    = "#f7768e"
peach     = "#e0af68"
teal      = "#7dcfff"
sky       = "#7dcfff"
sapphire  = "#7aa2f7"
lavender  = "#bb9af7"

# Text shades
text      = "#c0caf5"
subtext1  = "#a9b1d6"
subtext0  = "#414868"

# Surface shades
overlay2  = "#414868"
overlay1  = "#414868"
overlay0  = "#15161e"
surface2  = "#15161e"
surface1  = "#15161e"
surface0  = "#1a1b26"
base      = "#1a1b26"
mantle    = "#1a1b26"
crust     = "#1a1b26"
