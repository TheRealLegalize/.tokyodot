"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character"""

palette = 'tokyonight'

[directory]
style = "bold blue"
format = "[$path]($style)"
truncation_length = 2
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold yellow"
format = '[$symbol$branch]($style)'

[git_status]
style = "red"
format = '([\[$all_status$ahead_behind\]]($style))'

[cmd_duration]
min_time = 2000
show_milliseconds = false
format = " [$duration]($style)"
style = "overlay1"
disabled = false

[line_break]
disabled = true

[character]
disabled = false
success_symbol = ' [❯](bold green) '
error_symbol = ' [❯](bold red) '
vimcmd_symbol = ' [❮](bold green) '
vimcmd_replace_one_symbol = ' [❮](bold lavender) '
vimcmd_replace_symbol = ' [❮](bold lavender) '
vimcmd_visual_symbol = ' [❮](bold yellow) '

# Все остальные модули отключены для сохранения дзен-режима
[os]
disabled = true
[username]
disabled = true
[time]
disabled = true
[c]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[nodejs]
disabled = true
[bun]
disabled = true
[python]
disabled = true

