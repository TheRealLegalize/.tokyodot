rosewater = "#ff9e3b"
flamingo  = "#ff7a93"
pink      = "#ff007f"
mauve     = "#bb9af7"
red       = "#f7768e"
maroon    = "#db4b4b"
peach     = "#ff9e64"
yellow    = "#e0af68"
green     = "#9ece6a"
teal      = "#1abc9c"
sky       = "#7dcfff"
sapphire  = "#2ac3de"
blue      = "#7aa2f7"
lavender  = "#b4f9f8"
text      = "#c0caf5"
subtext1  = "#a9b1d6"
