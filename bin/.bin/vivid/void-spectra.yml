colors:
  fg:        "c4e0ff" # --text
  bg:        "181818" # --base

  gray1:     "2f2f2f" # --surface-0
  gray2:     "3b434d" # --surface-1
  gray3:     "768699" # --overlay-1

  red1:      "eb0000" # --red
  red2:      "ff1414" # --bright-red
  orange:    "eb8700" # --accent
  yellow:    "eb8700" # --yellow

  green1:    "00eb07" # --green
  green2:    "00beeb" # --cyan
  green3:    "18ff1f" # --bright-green

  blue1:     "147eff" # --bright-blue
  blue2:     "006ceb" # --blue
  blue3:     "147eff" # --bright-blue (дубль для соответствия структуре)
  blue4:     "14d2ff" # --bright-cyan
  blue5:     "00beeb" # --cyan
  blue6:     "006ceb" # --blue

  purple1:   "7900eb" # --purple
  purple2:   "9514ff" # --bright-purple

  bg_red1:   "161616" # --mantle
  bg_orange: "2d2d2d" # --crust
  bg_yellow: "2f2f2f" # --surface-0
  bg_green1: "3b434d" # --surface-1
  bg_green2: "4f565f" # --surface-2

core: # See `dircolors -p` for explanations
  normal_text:
    foreground: gray3

  regular_file: {}

  reset_to_normal:
    foreground: gray3

  directory:
    foreground: blue6
    font-style: bold

  executable_file: # Files with exec permissions
    foreground: green1
    font-style: bold

  file_with_capability:
    background: gray1

  setuid:
    background: gray1

  setgid:
    background: gray1

  sticky:
    background: gray1

  sticky_other_writable: # Usually a directory on Linux
    foreground: bg
    background: blue6
    font-style: bold

  other_writable: # Ditto ^
    foreground: blue6
    background: gray1
    font-style: bold

  symlink:
    foreground: blue4
    font-style: italic

  broken_symlink:
    foreground: bg
    background: red2

  missing_symlink_target:
    foreground: red2

  multi_hard_link: {}

  socket:
    foreground: green2
    background: bg_green2
    font-style: bold

  fifo:
    foreground: orange
    background: bg_orange
    font-style: bold

  door:
    foreground: green1
    background: bg_green1
    font-style: bold

  block_device:
    foreground: red1
    background: bg_red1
    font-style: bold

  character_device:
    foreground: yellow
    background: bg_yellow
    font-style: bold

executable: # Libs and exec binaries (without exec permissions)
  foreground: green2

archives:
  foreground: red1
  font-style: bold

media:
  audio:
    foreground: blue3
    font-style: bold
  image:
    foreground: purple1
    font-style: bold
  video:
    foreground: green3
    font-style: bold
  fonts:
    foreground: green2
    font-style: bold
  3d:
    foreground: purple1
    font-style: bold

office:
  foreground: purple2
  font-style: bold

text:
  foreground: fg
  configuration:
    foreground: orange
    dockerfile:
      foreground: blue2
  licenses:
    foreground: fg
    font-style: bold
  special:
    foreground: blue5
    font-style: bold
  todo:
    foreground: blue1
    font-style: bold

markup:
  foreground: fg

programming:
  foreground: yellow
  tooling:
    foreground: blue3
    continuous-integration:
      foreground: blue2

unimportant:
  foreground: gray2
